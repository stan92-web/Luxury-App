<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Luxury House — Survey Sheet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div>
      <div class="logo-text">Luxury House</div>
      <div class="logo-sub">Survey &amp; Measurement Sheet</div>
    </div>
  </div>
  <div class="header-right">
    <span id="header-date" class="header-date"></span>
    <button class="btn btn-outline no-print" onclick="Survey.print()">🖨️ Print / PDF</button>
  </div>
</header>

<main>

  <!-- ── Customer Details ── -->
  <div class="card" id="customer-card">
    <div class="card-title">👤 Customer Details</div>

    <div class="sub-heading">Required</div>
    <div class="form-grid">
      <div class="form-group">
        <label>First Name <span class="req">*</span></label>
        <input type="text" id="c-first" placeholder="James" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label>Phone / WhatsApp <span class="req">*</span></label>
        <input type="tel" id="c-phone" placeholder="+44 7700 900000" autocomplete="tel">
      </div>
      <div class="form-group full">
        <label>Installation Address <span class="req">*</span></label>
        <input type="text" id="c-address" placeholder="12 Manor Road, London, SW1A 1AA" autocomplete="street-address">
      </div>
    </div>

    <div class="sub-heading muted" style="margin-top:18px">Optional</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="c-last" placeholder="Mitchell" autocomplete="family-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="c-email" placeholder="james@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Lead Source</label>
        <select id="c-source">
          <option>Website Enquiry</option>
          <option>Referral</option>
          <option>Social Media</option>
          <option>Showroom Visit</option>
          <option>Google Ads</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Surveyor / Rep</label>
        <input type="text" id="surveyor" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Survey Date</label>
        <input type="date" id="survey-date">
      </div>
      <div class="form-group">
        <label>🔒 Internal Notes</label>
        <input type="text" id="c-notes" placeholder="e.g. Referred by Smith family">
      </div>
    </div>
  </div>

  <!-- ── Rooms / Wardrobes ── -->
  <div id="rooms-container"></div>

  <div class="btn-row no-print">
    <button class="btn btn-red" onclick="Survey.addRoom()">+ Add Wardrobe / Room</button>
    <button class="btn btn-dark" onclick="Survey.clearAll()" style="margin-left:auto">🗑 New Survey</button>
  </div>

</main>

<div id="toast"></div>

<!-- ── Full-Screen Sketch Overlay ── -->
<div id="fs-overlay">
  <div id="fs-bar">
    <div id="fs-tools">
      <button class="sk-btn active" id="fs-tool-pen"  onclick="Sketch.fsSetTool('pen')">✏️ Draw</button>
      <button class="sk-btn"        id="fs-tool-line" onclick="Sketch.fsSetTool('line')">╱ Line</button>
      <button class="sk-btn"        id="fs-tool-rect" onclick="Sketch.fsSetTool('rect')">▭ Box</button>
      <button class="sk-btn"        id="fs-tool-text" onclick="Sketch.fsSetTool('text')">T Label</button>
      <div class="sk-sep"></div>
      <div class="colour-dots" id="fs-colours">
        <div class="colour-dot active" style="background:#222222" onclick="Sketch.fsSetColour('#222222',this)" title="Black"></div>
        <div class="colour-dot"        style="background:#c0392b" onclick="Sketch.fsSetColour('#c0392b',this)" title="Red"></div>
        <div class="colour-dot"        style="background:#1a6eb5" onclick="Sketch.fsSetColour('#1a6eb5',this)" title="Blue"></div>
        <div class="colour-dot"        style="background:#27ae60" onclick="Sketch.fsSetColour('#27ae60',this)" title="Green"></div>
      </div>
      <div class="sk-sep"></div>
      <button class="sk-btn active" id="fs-straighten" onclick="Sketch.fsToggleStraighten(this)" title="Snap hand-drawn lines to straight">⟋ Straighten</button>
      <div class="sk-sep"></div>
      <button class="sk-btn" onclick="Sketch.fsUndo()">↩ Undo</button>
      <button class="sk-btn" onclick="Sketch.fsClear()">🗑 Clear</button>
    </div>
    <button class="btn btn-red fs-done-btn" onclick="Sketch.closeFullscreen()">✓ Done</button>
  </div>
  <div id="fs-canvas-area">
    <canvas id="fs-canvas"></canvas>
  </div>
</div>

<script src="js/sketch.js"></script>
<script src="js/survey.js"></script>
</body>
</html>

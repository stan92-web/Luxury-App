<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Luxury House — Quote / Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Login Screen ── -->
<div id="auth-screen">
  <div id="auth-box">
    <div class="auth-logo-mark">LH</div>
    <div class="auth-logo-text">Luxury House</div>
    <div class="auth-logo-sub">Quote &amp; Order</div>
    <div class="auth-label">Enter Access Code</div>
    <input id="auth-input" type="password" inputmode="numeric"
      placeholder="——————" maxlength="10" autocomplete="off">
    <button class="auth-btn" onclick="Auth.attempt()">Access App</button>
    <div id="auth-error">Incorrect code — try again</div>
  </div>
</div>

<!-- ── Main App ── -->
<div id="app-wrap">

<header>
  <div class="logo">
    <div class="logo-mark">LH</div>
    <div>
      <div class="logo-text">Luxury House</div>
      <div class="logo-sub">Quote &amp; Order</div>
    </div>
  </div>
  <div class="header-right">
    <span id="header-date" class="header-date"></span>
    <button class="btn btn-orders btn-sm no-print" onclick="Orders.openPanel()" title="View all saved orders">📋 Orders</button>
    <button class="btn btn-email btn-sm no-print" onclick="Orders.sendEmail()" title="Email quote to customer">✉️ Email</button>
    <button class="btn btn-save btn-sm no-print" onclick="Orders.save()" title="Save order to Google Sheets">💾 Save</button>
    <button class="btn btn-wa btn-sm no-print" onclick="Survey.sendToOffice()" title="Send to office WhatsApp"><svg class="wa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Office</button>
    <button class="btn btn-wa btn-sm no-print" onclick="Survey.sendToCustomer()" title="Send to customer WhatsApp"><svg class="wa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Customer</button>
    <button class="btn btn-outline no-print" onclick="Survey.print()">🖨️ Print / PDF</button>
    <button class="btn btn-dark btn-sm no-print" onclick="Auth.logout()" title="Log out">🔒</button>
  </div>
</header>

<main>

  <!-- ── Customer Details ── -->
  <div class="card" id="customer-card">
    <div class="card-title">👤 Customer Details</div>

    <div class="form-grid customer-req-grid">
      <div class="form-group cust-req-field">
        <label>Name <span class="req">*</span></label>
        <input type="text" id="c-first" placeholder="James Mitchell" autocomplete="name">
      </div>
      <div class="form-group cust-req-field">
        <label>Phone / WhatsApp <span class="req">*</span></label>
        <input type="tel" id="c-phone" placeholder="+44 7700 900000" autocomplete="tel">
      </div>
      <div class="form-group customer-address-group cust-req-field">
        <label>Installation Address <span class="req">*</span></label>
        <input type="text" id="c-address" placeholder="42 Manor Road, London, SW1A 1AA" autocomplete="street-address">
      </div>
    </div>

    <div class="sub-heading muted cust-optional-heading" style="margin-top:18px">Optional</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="c-last" placeholder="Mitchell" autocomplete="family-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="c-email" placeholder="james@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Lead Source</label>
        <select id="c-source">
          <option>Website Enquiry</option>
          <option>Referral</option>
          <option>Social Media</option>
          <option>Showroom Visit</option>
          <option>Google Ads</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Rep / Designer</label>
        <input type="text" id="surveyor" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Quote Date</label>
        <input type="date" id="survey-date">
      </div>
      <div class="form-group">
        <label>🔒 Internal Notes</label>
        <input type="text" id="c-notes" placeholder="e.g. Referred by Smith family">
      </div>
    </div>
  </div>

  <!-- ── Rooms / Wardrobes ── -->
  <div id="rooms-container"></div>

  <!-- ── Pricing ── -->
  <div class="card" id="pricing-card">
    <div class="card-title">💰 Pricing</div>
    <div class="pricing-row">
      <div class="price-group">
        <label>Total</label>
        <div class="price-wrap">
          <span class="price-sym">£</span>
          <input type="number" id="p-total" placeholder="0.00" inputmode="decimal" step="0.01" min="0">
        </div>
      </div>
      <div class="price-group">
        <label>Deposit</label>
        <div class="price-wrap">
          <span class="price-sym">£</span>
          <input type="number" id="p-deposit" placeholder="0.00" inputmode="decimal" step="0.01" min="0">
        </div>
      </div>
      <div class="price-group price-balance">
        <label>Balance Due</label>
        <div class="price-wrap">
          <span class="price-sym">£</span>
          <input type="number" id="p-balance" placeholder="0.00" readonly tabindex="-1">
        </div>
      </div>
    </div>
  </div>

  <div class="btn-row no-print">
    <button class="btn btn-red" onclick="Survey.addRoom()">+ Add Wardrobe / Room</button>
    <button class="btn btn-dark" onclick="Survey.clearAll()" style="margin-left:auto">🗑 New Quote</button>
  </div>

</main>

<div id="toast"></div>

</div><!-- end app-wrap -->

<!-- ── Full-Screen Sketch Overlay ── -->
<div id="fs-overlay">
  <div id="fs-bar">
    <div id="fs-tools">
      <!-- Drawing tools -->
      <button class="sk-btn sk-tool-btn active" id="fs-tool-pen"    onclick="Sketch.fsSetTool('pen')"    title="Freehand draw">Pen</button>
      <button class="sk-btn sk-tool-btn"        id="fs-tool-select" onclick="Sketch.fsSetTool('select')" title="Select &amp; move shapes">Select</button>
      <button class="sk-btn sk-tool-btn"        id="fs-tool-line"   onclick="Sketch.fsSetTool('line')"   title="Draw straight line">Line</button>
      <button class="sk-btn sk-tool-btn"        id="fs-tool-rect"   onclick="Sketch.fsSetTool('rect')"   title="Draw rectangle">Box</button>
      <button class="sk-btn sk-tool-btn"        id="fs-tool-text"   onclick="Sketch.fsSetTool('text')"   title="Add text annotation">Text</button>
      <div class="sk-sep"></div>
      <!-- Colours -->
      <div class="colour-dots" id="fs-colours">
        <div class="colour-dot active" style="background:#222222" onclick="Sketch.fsSetColour('#222222',this)" title="Black"></div>
        <div class="colour-dot"        style="background:#c0392b" onclick="Sketch.fsSetColour('#c0392b',this)" title="Red"></div>
        <div class="colour-dot"        style="background:#1a6eb5" onclick="Sketch.fsSetColour('#1a6eb5',this)" title="Blue"></div>
        <div class="colour-dot"        style="background:#27ae60" onclick="Sketch.fsSetColour('#27ae60',this)" title="Green"></div>
      </div>
      <div class="sk-sep"></div>
      <!-- Furniture dropdown -->
      <div class="sk-furniture-wrap">
        <button class="sk-btn sk-tpl-btn" onclick="Sketch.fsFurnitureMenu()" title="Add furniture template">Furniture ▾</button>
        <div class="sk-furniture-panel" id="fs-furn-panel">
          <button class="sk-furn-item" onclick="Sketch.fsTpl('4door');  Sketch.fsCloseFurniture()">▭ 4-Door Wardrobe</button>
          <button class="sk-furn-item" onclick="Sketch.fsTpl('corner'); Sketch.fsCloseFurniture()">⌐ Corner Wardrobe</button>
          <button class="sk-furn-item" onclick="Sketch.fsTpl('chest');  Sketch.fsCloseFurniture()">▤ Chest of Drawers</button>
          <button class="sk-furn-item" onclick="Sketch.fsTpl('desk');   Sketch.fsCloseFurniture()">▭ Desk w/ 2 Drawers</button>
        </div>
      </div>
      <!-- Shape controls: door/drawer count — visible right after Furniture when 4-door or chest selected -->
      <button class="sk-btn sk-section-btn" id="fs-section-rem" onclick="Sketch.fsRemoveSection()" title="Remove one door/drawer" style="display:none">– Door</button>
      <span class="sk-section-count"        id="fs-section-count"                                   style="display:none">4</span>
      <button class="sk-btn sk-section-btn" id="fs-section-add" onclick="Sketch.fsAddSection()"    title="Add one door/drawer"    style="display:none">+ Door</button>
      <div class="sk-sep"                   id="fs-section-sep"                                     style="display:none"></div>
      <!-- Shape controls: flip — visible right after Furniture when corner or desk selected -->
      <button class="sk-btn sk-section-btn" id="fs-corner-flip" onclick="Sketch.fsFlipCorner()" title="Mirror corner wardrobe / desk pedestal" style="display:none">⇄ Flip</button>
      <div class="sk-sep"                   id="fs-corner-sep"                                   style="display:none"></div>
      <div class="sk-sep"></div>
      <!-- Measurements — always grouped together -->
      <button class="sk-btn sk-meas-btn" onclick="Sketch.fsInsertMeasurement('Width','W')"  title="Insert Width label">↔ Width</button>
      <button class="sk-btn sk-meas-btn" onclick="Sketch.fsInsertMeasurement('Height','H')" title="Insert Height label">↕ Height</button>
      <button class="sk-btn sk-meas-btn" onclick="Sketch.fsInsertMeasurement('Deep','D')"   title="Insert Deep label">⬛ Deep</button>
      <div class="sk-sep"></div>
      <!-- Erase / Undo / Delete — grouped near Done -->
      <button class="sk-btn sk-tool-btn" id="fs-tool-eraser" onclick="Sketch.fsSetTool('eraser')" title="Erase freehand strokes">Erase</button>
      <button class="sk-btn sk-undo-btn"
        onpointerdown="Sketch._fsUndoClearDown(this)"
        onpointerup="Sketch._fsUndoClearUp(this)"
        onpointercancel="Sketch._fsUndoClearCancel(this)"
        oncontextmenu="return false"
        title="Undo (tap) • Hold to clear all">↩ Undo</button>
      <button class="sk-btn sk-del-btn" onclick="Sketch.fsDeleteSelected()" title="Delete selected shape">✕ Del</button>
    </div>
    <button class="btn btn-red fs-done-btn" onclick="Sketch.closeFullscreen()">✓ Done</button>
  </div>
  <div id="fs-canvas-area">
    <canvas id="fs-canvas"></canvas>
  </div>
</div>

<!-- ── Orders Panel ── -->
<div id="orders-overlay">
  <div id="orders-bar">
    <div id="orders-bar-left">
      <div class="orders-title">📋 Saved Orders</div>
      <input type="text" id="orders-search-input" placeholder="Search customer, address, order ID…" oninput="Orders.setSearch(this.value)">
    </div>
    <div id="orders-filters">
      <button class="ofilter-btn active" data-status="" onclick="Orders.setFilter('',this)">All</button>
      <button class="ofilter-btn" data-status="Quote"     onclick="Orders.setFilter('Quote',this)">Quotes</button>
      <button class="ofilter-btn" data-status="Order"     onclick="Orders.setFilter('Order',this)">Orders</button>
      <button class="ofilter-btn" data-status="Installed" onclick="Orders.setFilter('Installed',this)">Installed</button>
    </div>
    <div id="orders-bar-right">
      <button class="btn btn-outline btn-sm" onclick="Orders.refresh()">↻ Refresh</button>
      <button class="btn btn-dark btn-sm"    onclick="Orders.closePanel()">✕ Close</button>
    </div>
  </div>
  <div id="orders-list">
    <div class="orders-loading">Loading…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/auth.js?v=52"></script>
<script src="js/data.js?v=52"></script>
<script src="js/sketch.js?v=52"></script>
<script src="js/survey.js?v=52"></script>
<script src="js/orders.js?v=52"></script>
</body>
</html>
